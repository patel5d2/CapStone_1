global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    basic_auth:
      username: prometheus
      password_file: /run/secrets/metrics_password
    static_configs:
      - targets: ['app:8080']
