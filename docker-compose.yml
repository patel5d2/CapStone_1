# Every service drops all Linux capabilities (Postgres adds back only what its entrypoint
# needs to hand the data directory to the postgres user), cannot gain privileges, and runs
# on a read-only root filesystem with tmpfs where it writes scratch files (Prometheus is the
# one exception; see below). Published ports bind to loopback only.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: enterprise-db
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-${DEV_DATABASE_NAME}}
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /var/run/postgresql
      - /tmp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  # Spring Boot application, serving the compiled React SPA from its static
  # resources. Built from this checkout so `docker compose up` runs the code in
  # the working tree — including the frontend, which the Dockerfile compiles in
  # its own stage. To run a published image instead, comment out `build` and
  # pull ghcr.io/patel5d2/capstone_1:latest.
  app:
    build:
      context: .
      args:
        VITE_CLERK_PUBLISHABLE_KEY: "${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_aW5ub2NlbnQtbWFjYXctMTY4Ny5jbGVyay5hY2NvdW50cy5kZXYk}"
        VITE_REQUIRE_TWO_FACTOR: "${CAMPUSBRIDGE_AUTH_REQUIRE_TWO_FACTOR:-true}"
    image: ghcr.io/patel5d2/capstone_1:local
    container_name: enterprisedevgroupproject
    <<: *hardened
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_OPTS: "${JAVA_OPTS}"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE}"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: "${DATABASE_USERNAME}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD}"
      DEV_DATABASE_NAME: "${DEV_DATABASE_NAME}"
      PROD_DATABASE_NAME: "${PROD_DATABASE_NAME}"
      CLERK_ISSUER: "${CLERK_ISSUER:-https://innocent-macaw-1687.clerk.accounts.dev}"
      CLERK_JWKS_URI: "${CLERK_JWKS_URI:-https://innocent-macaw-1687.clerk.accounts.dev/.well-known/jwks.json}"
      CAMPUSBRIDGE_AUTH_REQUIRE_TWO_FACTOR: "${CAMPUSBRIDGE_AUTH_REQUIRE_TWO_FACTOR:-true}"
      # Empty unless the environment supplies it; the webhook then refuses deliveries
      # rather than the app failing to start.
      CLERK_WEBHOOK_SECRET: "${CLERK_WEBHOOK_SECRET:-}"
      CLOUDINARY_URL: "${CLOUDINARY_URL:-}"
      CAMPUSBRIDGE_MONITORING_ENABLED: "true"
      METRICS_PASSWORD: "${METRICS_PASSWORD:?Set METRICS_PASSWORD for the Prometheus service account}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - monitoring

  # Prometheus
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: enterprise-prometheus
    <<: *hardened
    # Compose writes the environment-sourced metrics_password secret into the container
    # at start, which a read-only root filesystem refuses.
    read_only: false
    ports:
      - "127.0.0.1:9090:9090"
    secrets:
      - metrics_password
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitoring

  # Grafana
  grafana:
    image: grafana/grafana:11.5.2
    container_name: enterprise-grafana
    <<: *hardened
    tmpfs:
      - /tmp
      - /var/log/grafana:mode=1777
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  pgdata:
  prometheus_data:
  grafana_data:

networks:
  backend:
    driver: bridge
  monitoring:
    driver: bridge

secrets:
  metrics_password:
    environment: METRICS_PASSWORD
