# Development profile, and the profile used when none is chosen (application.yml). It
# replaces the H2 in-memory datasource with the shared Aiven PostgreSQL database, whose
# data survives restarts.
# The password is read from DATABASE_PASSWORD: set it in the git-ignored .env file at the
# project root (loaded below), or as an environment variable / Run Configuration.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://campus-bridge-dev-jonathan-7163.d.aivencloud.com:11945/campus_bridge_development?sslmode=require
    username: avnadmin
    password: ${DATABASE_PASSWORD}
    # Aiven closes idle connections, and a sleeping laptop drops them too; both showed up as
    # "Failed to validate connection ... closed" warnings. Retire connections before that
    # happens and ping idle ones so they stay open.
    hikari:
      max-lifetime: 300000   # 5 min
      keepalive-time: 120000 # 2 min
      # Everyone's running backend shares this database's small connection limit, and
      # Hikari's default pool of 10 per backend filled it ("remaining connection slots are
      # reserved"). Three is plenty for one developer.
      maximum-pool-size: 3
      minimum-idle: 1
  sql:
    init:
      mode: never
