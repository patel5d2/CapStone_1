# Shared development database. The base application.yml already points at Postgres;
# this profile exists so a team database can be targeted without editing it.
# Flyway owns the schema — there is no spring.sql.init here on purpose.
spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DEV_DATABASE_NAME:enterprise_dev}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
