# Test-only overrides. This is application.properties, not application.yml, on
# purpose: a test application.yml would shadow src/main's file outright and take
# the Clerk resource-server configuration down with it. A .properties file in the
# test classpath is merged over the main .yml instead, so only the keys below change.
#
# One fresh H2 database per cached Spring context: a shared name would make the
# second context re-run schema.sql against tables the first one already created.
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1

# Same schema.sql, data.sql and schema validation as the application.
spring.jpa.hibernate.ddl-auto=validate
