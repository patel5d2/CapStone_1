# Test-only overrides. This is application.properties, not application.yml, on
# purpose: a test application.yml would shadow src/main's file outright and take
# the Clerk resource-server configuration down with it. A .properties file in the
# test classpath is merged over the main .yml instead, so only the keys below change.
#
# PostgresTestConfiguration supplies a disposable PostgreSQL 16 service connection.
# A database test that forgets to import it must fail, never use a developer's DB.
# Service-connection details take precedence over this deliberately unreachable URL.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/testcontainers-required

# Exercise the same migrations and schema validation as the application. There is
# no alternate test schema, Hibernate schema creation, or developer database reuse.
spring.flyway.enabled=true
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
