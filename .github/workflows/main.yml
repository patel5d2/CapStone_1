name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a PR's run; on main every merge runs to the end (queued), so a
# deploy or release is never cut off halfway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Validate release workflow policy
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/release.yml
          grep -Fq 'image_name="${GITHUB_REPOSITORY,,}"' .github/workflows/release.yml
          grep -Fq 'uses: docker/setup-qemu-action@v4' .github/workflows/release.yml
          grep -Fq 'platforms: linux/amd64,linux/arm64' .github/workflows/release.yml
          if grep -Fqi '/enterprisedevgroupproject' .github/workflows/release.yml; then
            echo "Release workflow must publish to the current repository package name." >&2
            exit 1
          fi
          if grep -Fqi 'CREDENTIALS.txt' .github/workflows/release.yml; then
            echo "Release workflow must not publish generated credentials." >&2
            exit 1
          fi

      - name: Verify application
        run: ./mvnw --batch-mode verify

      - name: Upload backend jar for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: target/EnterpriseDevGroupProject-*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload JaCoCo coverage report
        if: always() && hashFiles('target/site/jacoco/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Auth/session flows and the school palettes' contrast ledger (invariant 11).
      - name: Test
        working-directory: frontend
        run: npm test

      - name: Type-check and build
        working-directory: frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_aW5ub2NlbnQtbWFjYXctMTY4Ny5jbGVyay5hY2NvdW50cy5kZXYk
        run: npm run build

  # Everything a visitor reaches without signing in, in Chromium, Firefox and WebKit at
  # desktop and 375px. e2e/signed-in.spec.ts skips itself here (no Clerk test account).
  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright
        working-directory: frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_aW5ub2NlbnQtbWFjYXctMTY4Ny5jbGVyay5hY2NvdW50cy5kZXYk
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  container-build:
    name: Validate container startup
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend]
    timeout-minutes: 20
    env:
      CI_IMAGE: capstone-1:ci
      CI_COMPOSE_PROJECT: campusbridge-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      CI_SMOKE_ARTIFACTS: reports/container-smoke
      CI_MONITORING: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Load the native image into Docker so Compose tests this exact artifact.
      # The release workflow still publishes both amd64 and arm64.
      - name: Build and load container without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: capstone-1:ci
          build-args: |
            VITE_REQUIRE_TWO_FACTOR=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start built container and verify health, SPA, and monitoring
        run: bash scripts/smoke-container.sh

      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-smoke-diagnostics
          path: reports/container-smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up disposable stack after cancellation or failure
        if: always()
        env:
          METRICS_PASSWORD: disposable-ci-metrics
        run: >-
          docker compose --env-file /dev/null -f docker-compose.ci.yml
          -p "$CI_COMPOSE_PROJECT" --profile monitoring down --volumes --remove-orphans

  # Ships the tested jar to Proxmox VM 104 (192.168.0.93), which serves
  # https://api.dharmintech.org through the Cloudflare Tunnel. GitHub's hosted runners
  # cannot reach that LAN, so this job runs on a self-hosted runner on the VM itself.
  # The runner user owns /opt/campusbridge and may only `systemctl restart campusbridge`.
  # The frontend is deployed separately by Cloudflare Workers Builds on the same push.
  deploy-backend:
    name: Deploy backend to VM 104
    runs-on: [self-hosted, linux, campusbridge-vm]
    needs: [build-and-test, frontend, e2e, container-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment:
      name: production
      url: https://campusbridge.dharmintech.org

    steps:
      - name: Download backend jar
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: artifact

      - name: Install jar and restart, rolling back if unhealthy
        shell: bash
        run: |
          set -euo pipefail
          dir=/opt/campusbridge
          jar=$(ls artifact/EnterpriseDevGroupProject-*.jar | grep -v plain | head -1)
          cp "$dir/app.jar" "$dir/app.jar.prev"
          cp "$jar" "$dir/app.jar.new" && mv "$dir/app.jar.new" "$dir/app.jar"
          sudo systemctl restart campusbridge
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then
              echo "Backend healthy on $(hostname)"; exit 0
            fi
            sleep 2
          done
          echo "::error::New backend did not become healthy; restoring the previous jar"
          mv "$dir/app.jar.prev" "$dir/app.jar"
          sudo systemctl restart campusbridge
          exit 1

      - name: Verify the public API and the Cloudflare frontend reach this backend
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://api.dharmintech.org/actuator/health
          echo
          # Through the Worker, /api must come back from Spring (401 without a token),
          # not as the SPA's index.html (200), which means the proxy is not wired.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://campusbridge.dharmintech.org/api/schools)
            [ "$code" = 401 ] && { echo "Frontend -> backend proxy OK"; exit 0; }
            sleep 10
          done
          echo "::error::https://campusbridge.dharmintech.org/api/schools answered $code, expected 401 from the backend"
          exit 1

  # Every merge to main that passes the checks above becomes a GitHub release (jar, SBOM,
  # checksums) and a multi-arch GHCR image tagged :main, :latest and its version. It does not
  # wait for the VM deploy, so an offline VM never holds a release back.
  release:
    name: Publish release
    needs: [build-and-test, frontend, e2e, container-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
      security-events: write
