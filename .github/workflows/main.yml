name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Validate release workflow policy
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/release.yml
          grep -Fq 'image_name="${GITHUB_REPOSITORY,,}"' .github/workflows/release.yml
          grep -Fq 'uses: docker/setup-qemu-action@v4' .github/workflows/release.yml
          grep -Fq 'platforms: linux/amd64,linux/arm64' .github/workflows/release.yml
          if grep -Fqi '/enterprisedevgroupproject' .github/workflows/release.yml; then
            echo "Release workflow must publish to the current repository package name." >&2
            exit 1
          fi
          if grep -Fqi 'CREDENTIALS.txt' .github/workflows/release.yml; then
            echo "Release workflow must not publish generated credentials." >&2
            exit 1
          fi

      - name: Verify application
        run: ./mvnw --batch-mode verify

      - name: Upload JaCoCo coverage report
        if: always() && hashFiles('target/site/jacoco/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check and build
        working-directory: frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_bWlnaHR5LWVzY2FyZ290LTY1NjIuY2xlcmsuYWNjb3VudHMuZGV2JA
        run: npm run build

  container-build:
    name: Validate container startup
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend]
    timeout-minutes: 20
    env:
      CI_IMAGE: capstone-1:ci
      CI_COMPOSE_PROJECT: campusbridge-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      CI_SMOKE_ARTIFACTS: reports/container-smoke
      CI_MONITORING: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Load the native image into Docker so Compose tests this exact artifact.
      # The release workflow still publishes both amd64 and arm64.
      - name: Build and load container without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: capstone-1:ci
          build-args: |
            VITE_REQUIRE_TWO_FACTOR=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start built container and verify health, SPA, and monitoring
        run: bash scripts/smoke-container.sh

      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-smoke-diagnostics
          path: reports/container-smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up disposable stack after cancellation or failure
        if: always()
        env:
          METRICS_PASSWORD: disposable-ci-metrics
        run: >-
          docker compose --env-file /dev/null -f docker-compose.ci.yml
          -p "$CI_COMPOSE_PROJECT" --profile monitoring down --volumes --remove-orphans
