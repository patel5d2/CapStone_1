name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Validate release workflow policy
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/release.yml
          grep -Fq 'image_name="${GITHUB_REPOSITORY,,}"' .github/workflows/release.yml
          if grep -Fqi '/enterprisedevgroupproject' .github/workflows/release.yml; then
            echo "Release workflow must publish to the current repository package name." >&2
            exit 1
          fi
          if grep -Fqi 'CREDENTIALS.txt' .github/workflows/release.yml; then
            echo "Release workflow must not publish generated credentials." >&2
            exit 1
          fi

      - name: Verify application
        run: ./mvnw --batch-mode verify

      - name: Upload JaCoCo coverage report
        if: always() && hashFiles('target/site/jacoco/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

  container-build:
    name: Validate container build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: capstone-1:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
