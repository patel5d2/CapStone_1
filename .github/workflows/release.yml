name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Validate tag against Maven version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pom_version="$(./mvnw --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$pom_version" == *-SNAPSHOT ]]; then
            echo "Release builds require a non-SNAPSHOT Maven version." >&2
            exit 1
          fi

          if [[ "$tag_version" != "$pom_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Maven version $pom_version." >&2
            exit 1
          fi

          echo "version=$pom_version" >> "$GITHUB_OUTPUT"

      - name: Build and test release
        run: ./mvnw --batch-mode verify

      - name: Stage versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          jar_path="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print -quit)"
          test -n "$jar_path"
          cp "$jar_path" "dist/student-directory-${{ steps.version.outputs.version }}.jar"

      - name: Upload application JAR
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 90

  container:
    name: Publish container package
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Resolve repository package name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_name="${GITHUB_REPOSITORY,,}"
          echo "image=${REGISTRY}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push container image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published platforms
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"

          for architecture in amd64 arm64; do
            if ! jq -e --arg architecture "$architecture" \
              'any(.manifests[]; .platform.os == "linux" and .platform.architecture == $architecture)' \
              <<< "$manifest" >/dev/null; then
              echo "Published image is missing linux/${architecture}." >&2
              exit 1
            fi
          done

      - name: Attest container provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scan-type: image
          scanners: vuln

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM
          scan-type: image
          scanners: vuln

      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Generate CycloneDX image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: image-sbom.cdx.json

      - name: Upload image SBOM
        uses: actions/upload-artifact@v7
        with:
          name: image-sbom
          path: image-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build, container]
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Download application JAR
        uses: actions/download-artifact@v8
        with:
          name: application-jar
          path: dist

      - name: Download image SBOM
        uses: actions/download-artifact@v8
        with:
          name: image-sbom
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: shasum -a 256 * > SHA256SUMS

      - name: Attest JAR provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.jar

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.container.outputs.image }}
          DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > generated-notes.md

          {
            echo "## Container package"
            echo
            echo "\`${IMAGE}:${{ needs.build.outputs.version }}\`"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            cat generated-notes.md
          } > release-notes.md

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Student Directory $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Student Directory $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
